<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interactive Module - Fixed Input</title>
    <style>
        /* 基础重置与深色主题背景 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #131314;
            color: #e3e3e3;
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .chat-history::-webkit-scrollbar {
            width: 8px;
        }
        .chat-history::-webkit-scrollbar-thumb {
            background: #444746;
            border-radius: 4px;
        }

        .message {
            display: flex;
            gap: 16px;
            max-width: 85%;
        }
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message.ai {
            align-self: flex-start;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
            font-size: 14px;
        }
        .user .avatar { background-color: #a8c7fa; color: #041e49; }
        .ai .avatar { background-color: #ffffff; color: #000000; }

        .content {
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 16px;
            word-wrap: break-word;
        }
        .user .content {
            background-color: #282a2c;
            border-top-right-radius: 4px;
        }
        .ai .content {
            background-color: transparent;
            padding-left: 0;
            padding-top: 6px;
        }

        .input-container {
            padding: 20px;
            background: #131314;
            padding-bottom: 40px;
        }

        .input-box {
            display: flex;
            background: #1e1f20;
            border-radius: 24px;
            padding: 12px 16px;
            align-items: center;
            border: 1px solid transparent;
        }

        /* 恢复为 textarea，但光标变为 default 提示不可输入 */
        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #e3e3e3;
            font-size: 16px;
            resize: none;
            outline: none;
            padding: 4px 0;
            font-family: inherit;
            line-height: 1.5;
            cursor: default;
        }

        .input-box button {
            background: transparent;
            border: none;
            color: #c4c7c5;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            margin-left: 8px;
        }
        
        /* 发送按钮悬停效果，如果被禁用则无效果 */
        .input-box button:not(:disabled):hover {
            background: #333537;
            color: #e3e3e3;
        }
        
        /* 发送按钮被禁用时的样式 */
        .input-box button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .input-box button svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        
        .typing-indicator {
            display: inline-block;
            font-size: 16px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-history" id="chatHistory">
        <div class="message ai">
            <div class="avatar">AI</div>
            <div class="content">What’s on your mind today?</div>
        </div>
    </div>

    <div class="input-container">
        <div class="input-box">
            <textarea id="userInput" rows="2" readonly>I am bored. I want to watch a movie. I like anime comedy movies, or Marvel superhero movies. Give me some ideas. </textarea>
            <button id="sendBtn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>
    </div>
</div>

<script>
    const chatHistory = document.getElementById('chatHistory');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // 固定的 AI 专属回答
    const fixedAIResponse = "As you like animate comedies and Marvel superhero films, I highly recommend watching 'Spider-Man: Into the Spider-Verse' tonight. Enjoy the movie!";

    function sendMessage() {
        const text = userInput.value;
        if (!text) return;
        
        // 1. 发送消息到屏幕
        appendMessage('user', text);
        
        // 2. 清空输入框内容，并禁用发送按钮，防止重复点击
        userInput.value = '';
        sendBtn.disabled = true;

        // 3. 呼叫 AI 模拟回复
        simulateAIResponse();
    }

    function appendMessage(sender, text) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender}`;
        
        const avatarDiv = document.createElement('div');
        avatarDiv.className = 'avatar';
        avatarDiv.textContent = sender === 'user' ? 'Me' : 'AI';

        const contentDiv = document.createElement('div');
        contentDiv.className = 'content';
        contentDiv.innerHTML = text.replace(/\n/g, '<br>');

        messageDiv.appendChild(avatarDiv);
        messageDiv.appendChild(contentDiv);
        chatHistory.appendChild(messageDiv);

        chatHistory.scrollTop = chatHistory.scrollHeight;
        
        return contentDiv;
    }

    function simulateAIResponse() {
        const contentDiv = appendMessage('ai', '<span class="typing-indicator">● ● ●</span>');
        
        setTimeout(() => {
            // 直接输出固定的回答
            typeWriterEffect(contentDiv, fixedAIResponse, 0);
        }, 800);
    }

    function typeWriterEffect(element, text, index) {
        if (index === 0) {
            element.innerHTML = ''; 
        }
        
        if (index < text.length) {
            element.innerHTML += text.charAt(index);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            
            const typingSpeed = Math.floor(Math.random() * 30) + 20;
            setTimeout(() => typeWriterEffect(element, text, index + 1), typingSpeed);
        }
    }
</script>

</body>
</html>
